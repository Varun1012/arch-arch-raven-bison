<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var host = location.hostname;
        if (host && !/\.github\.io$/i.test(host) && location.protocol !== "file:") {
          document.write(
            '<base href="https://cdn.jsdelivr.net/gh/Varun1012/arch-arch-raven-bison@main/">'
          );
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>八號風球</title>
    <meta name="theme-color" content="#0b1218" />
    <meta
      name="description"
      content="搬遷香港、開李氏力場、護住恆生指數。西太平洋颱風季策略遊戲。亦可改打日本地圖《暴風警報》。"
    />
    <meta property="og:title" content="八號風球" />
    <meta
      property="og:description"
      content="搬遷香港、開李氏力場、護住恆生指數。亦可改打日本地圖《暴風警報》。"
    />
    <meta property="og:image" content="https://varun1012.github.io/arch-arch-raven-bison/og.jpg" />
    <meta property="og:url" content="https://varun1012.github.io/arch-arch-raven-bison/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="八號風球" />
    <meta name="twitter:image" content="https://varun1012.github.io/arch-arch-raven-bison/og.jpg" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&family=Noto+Serif+TC:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="map"></canvas>

      <div id="title" class="overlay">
        <img id="titleArt" src="maps/title.jpg" alt="" />
        <div class="veil"></div>
        <div class="sheet">
          <p id="titleKicker" class="kicker">西太平洋颱風季 · 恒生指數</p>
          <h1 id="titleName">八號風球</h1>
          <p id="titleSub" class="sub">李氏力場與搬遷香港</p>
          <p id="titleLede" class="lede">
            恆指以兩萬點開市，風季三分鐘。魔鬼風暴與少量超級魔鬼整季都可能出現。撐過可收市或無盡繼續。
          </p>
          <div class="map-pick" role="group" aria-label="地圖">
            <button id="pickHk" type="button" class="map-btn on">香港</button>
            <button id="pickJp" type="button" class="map-btn">日本</button>
          </div>
          <div class="row">
            <button id="start" type="button">進入風季</button>
            <button id="helpBtn" type="button" class="ghost">避風守則</button>
          </div>
          <p id="records" class="records">收市紀錄 — / 逼走氣旋 0</p>
        </div>
      </div>

      <div id="help" class="overlay dim hidden">
        <div class="card">
          <h2 id="helpTitle">避風守則</h2>
          <ul id="helpList"></ul>
          <button id="helpBack" type="button">返回</button>
        </div>
      </div>

      <div id="pause" class="overlay dim hidden">
        <div class="card pause-card">
          <h2 id="pauseTitle">暫停</h2>
          <p id="pauseLede" class="lede">氣旋不會等你。</p>
          <button id="resume" type="button">繼續</button>
          <button id="pauseHelp" type="button" class="ghost">避風守則</button>
          <button id="quit" type="button" class="ghost">離開</button>
        </div>
      </div>

      <div id="hud" class="hidden">
        <div class="top">
          <div class="chips">
            <div id="sig" class="chip">除下</div>
            <div id="cycle" class="chip bull">牛市</div>
            <button id="mute" type="button" class="icon" aria-label="靜音">聲</button>
            <button id="pauseBtn" type="button" class="icon" aria-label="暫停">停</button>
          </div>
          <div id="ticker">
            <div class="ticker-head">
              <span id="tickerIndex">恒生指數</span>
              <span id="tickerHint" class="muted">紅升綠跌 · 基準 20,000</span>
            </div>
            <div id="hsi">20,000.00</div>
            <div id="delta">+0</div>
            <canvas id="spark" width="168" height="28" aria-hidden="true"></canvas>
          </div>
        </div>
        <div id="banner" class="hidden"></div>
        <div class="bottom">
          <div id="stats"></div>
          <div class="actions desktop">
            <button id="lee" type="button">李氏力場</button>
            <button id="dash" type="button" class="dash">快閃移動</button>
            <button id="halt" type="button" class="halt" disabled>停市 5 秒</button>
            <div id="hint" class="hint hidden"></div>
          </div>
        </div>
      </div>

      <div id="touch" class="hidden">
        <div id="pad">
          <div id="knob"></div>
        </div>
        <button id="leeTouch" type="button" aria-label="力場"><span class="touch-n" id="leeN">3</span></button>
        <button id="dashTouch" type="button" class="dash" aria-label="快閃"><span class="touch-n" id="dashN">5</span></button>
        <button id="haltTouch" type="button" class="halt" aria-label="停市"><span class="touch-n" id="haltN">1</span></button>
      </div>

      <div id="end" class="overlay dim hidden">
        <div class="card">
          <p id="endKicker" class="kicker"></p>
          <h2 id="endTitle"></h2>
          <p id="endBody" class="lede"></p>
          <div id="endStats" class="stats-grid"></div>
          <button id="endless" type="button" class="hidden">無盡模式</button>
          <button id="leaveWin" type="button" class="ghost hidden">離開收市</button>
          <button id="replay" type="button">再來一季</button>
        </div>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
