name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static site files present
        run: |
          test -f index.html
          test -f game.js
          test -f styles.css
          test -f maps/east-asia.json
          echo "Live: https://varun1012.github.io/arch-arch-raven-bison/"
